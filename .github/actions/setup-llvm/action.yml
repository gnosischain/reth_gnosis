name: Setup LLVM 23
description: >
  Install m4 and LLVM 23 so evm2-jit / llvm-sys can build (reth's `jit` default feature)
  and gmp-mpfr-sys can build (`gmp` default feature). LLVM setup mirrors reth's own CI: it
  runs the vendored .github/scripts/install_llvm_ubuntu.sh, which configures apt.llvm.org and
  symlinks `llvm-config` onto PATH so llvm-sys finds it (no hardcoded LLVM_SYS_231_PREFIX
  needed).

runs:
  using: composite
  steps:
    - name: Install m4 + LLVM 23
      shell: bash
      run: |
        set -euo pipefail
        # m4 is preinstalled on GitHub ubuntu runners but ensure it (needed for gmp-mpfr-sys).
        sudo apt-get update
        sudo apt-get install -y m4
        sudo bash "$GITHUB_WORKSPACE/.github/scripts/install_llvm_ubuntu.sh" 23
