reth-cli = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-cli-commands = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-cli-runner = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-prune-types = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-ethereum-payload-builder = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-fs-util = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-etl = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-era = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-era-downloader = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-era-utils = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-eth-wire-types = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-execution-cache = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097", features = [
    "test-utils",
] }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-rpc-builder = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-stages = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-stages-api = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-stages-types = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-static-file-types = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }

# reth independent crates
reth-primitives-traits = { version = "0.8.2", default-features = false }

eyre = "0.6"
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", default-features = false, features = ["full"] }

# evm2
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb", default-features = false, features = ["std"] }
evm2-macros = { git = "https://github.com/alloy-rs/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }

futures-util = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
serde_with = "3"
hex = "0.4.3"
walkdir = "2.3.3"
thiserror = { version = "2.0.0", default-features = false }
thiserror-no-std = { version = "2.0.2", default-features = false }

# eth
alloy-chains = { version = "0.2.33", default-features = false }
alloy-dyn-abi = "1.6.1"
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-sol-macro = "1.5.0"
alloy-sol-types = "1.6.1"

alloy-rlp = { version = "0.3.16", default-features = false }
alloy-trie = { version = "0.9.8", default-features = false }

alloy-consensus = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-eip7928 = { version = "0.4.10", default-features = false }
alloy-genesis = { version = "2.5.0", default-features = false }
alloy-network = { version = "2.5.0", default-features = false }
alloy-rpc-types-eth = { version = "2.5.0", default-features = false }
alloy-rpc-types-engine = { version = "2.5.0", default-features = false }
alloy-serde = { version = "2.5.0", default-features = false }

rayon = "1.7"

tracing = "0.1.0"
reqwest = "0.13"
tokio = "1.52.3"
anyhow = "1.0"
indicatif = "0.17"
zstd = "0.13"
blake3 = "1.8"

[target.'cfg(unix)'.dependencies]
tikv-jemalloc-ctl = "0.6"
tikv-jemallocator = { version = "0.6", optional = true }
libc = "0.2"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]
testing = []
failing-tests = []
serde = []

# Mirror reth's own patches (patches don't propagate from git deps).
# Unifies evm2 revs between reth and reth-core; uses the pre-transfer URL since Cargo
# rejects a patch from the same source.
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-macros = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-jit = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }

[patch.crates-io]
# LLVM 23 support is not released yet.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "c9d9734ae17dbaf1d9902dab3b8ee9d2041781ff" }

# reth at this rev depends on unreleased reth-core.
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
