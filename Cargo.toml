[package]
name = "reth_gnosis"
version = "2.2.1"
edition = "2021"

[lib]
name = "reth_gnosis"
path = "src/lib.rs"

[[bin]]
name = "reth"
path = "src/main.rs"

[dependencies]
gnosis-primitives = { git = "https://github.com/gnosischain/rust-primitives.git", branch = "reth-pr-28264" }

reth = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
