reth-engine-local = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-node-metrics = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-chain-state = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", rev = "8572c88fe04fb2213d86f020ed9e72e612abb097" }
